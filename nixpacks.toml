[phases.setup]
nixPkgs = [
  "...",
  "nss",
  "freetype",
  "harfbuzz",
  "pango",
  "xorg.libX11",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXi",
  "xorg.libXrandr",
  "xorg.libxcb",
  "alsa-lib",
  "mesa"
]

[variables]
PUPPETEER_CACHE_DIR = "/app/.cache/puppeteer"

[phases.build]
cmds = [
  "pnpm install --no-frozen-lockfile", 
  "npx puppeteer browsers install chrome",
  "pnpm build"
]
