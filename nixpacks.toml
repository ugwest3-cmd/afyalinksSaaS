[phases.setup]
nixPkgs = [
  "...",
  "chromium",
  "nss",
  "freetype",
  "harfbuzz",
  "pango",
  "xorg.libX11",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXi",
  "xorg.libXrandr",
  "xorg.libxcb",
  "alsa-lib",
  "mesa"
]

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"

[phases.build]
cmds = [
  "pnpm install --no-frozen-lockfile", 
  "pnpm build"
]
